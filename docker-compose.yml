version: "3.8"

# 智能坐姿监测系统容器化部署
# 包含: MySQL + 后端(FastAPI) + 前端(Nginx)

services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: posture_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Wj686866
      MYSQL_DATABASE: smart_posture
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ---------- FastAPI 后端 ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: posture_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_USER: root
      DB_PASSWORD: Wj686866
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smart_posture
      LLM_API_KEY: ${LLM_API_KEY:-sk-your-api-key-here}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy

  # ---------- Vue3 前端 (Nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: posture_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
